[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocheck-educativo"
version = "1.1.0"
description = "Analizador lexico, sintactico y semantico de un DSL para redes neuronales"
requires-python = ">=3.10"
dependencies = ["lark>=1.1,<2"]

[project.optional-dependencies]
web = ["streamlit>=1.35,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
neurocheck = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
